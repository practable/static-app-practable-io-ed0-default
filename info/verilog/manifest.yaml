# Experiment list for the ELEE09024 DSD3 verisim directory page.
# Upload to: https://app.practable.io/ed0/static/info/verilog/manifest.yaml
# The page reads this file every time it loads, so edits show up straight away.

title: ELEE09024 Digital System Design 3
# subtitle: Verilog experiments — click a tile to open it in verisim
# logo: https://app.practable.io/ed0/static/info/verilog/images/practable-logo.png

# Simulator used for every tile. Change this one line to move to a new verisim version.
# (An experiment can override it with its own `simulator:` field.)
simulator: https://app.practable.io/ed0/static/ui/verisim-1.0/

# design/testbench paths are relative to `base` (full URLs also work).
base: https://app.practable.io/ed0/static/info/verilog/

# image paths are relative to `images` (falls back to `base` if this is left out).
images: https://app.practable.io/ed0/static/info/verilog/images/

experiments:
  # ---- All weeks: a blank simulator (no design or testbench) ----
  - name: "Blank VeriSim"
    description: "Opens VeriSim with no design or testbench loaded, ready for your own code."
    image: blank.svg
    weeks: all
    categories: [core]

  # ---- Week 3: Verilog (lecture examples, verbose practice benches) ----
  - name: "2-to-1 multiplexer"
    description: "Continuous assignment: one line, combinational by construction."
    image: week3/mux2.svg
    design: week3/mux2.v
    testbench: week3/tbv_mux2.v
    weeks: [3]
    categories: [core]

  - name: "4-to-1 multiplexer"
    description: "Every branch of the case is covered, so no latch is inferred."
    image: week3/mux4.svg
    design: week3/mux4.v
    testbench: week3/tbv_mux4.v
    weeks: [3]
    categories: [core]

  - name: "Incomplete case: an inferred latch"
    description: "Deliberately wrong. The 11 branch is missing, so y keeps its previous value when sel=11, which is a latch."
    image: week3/mux4_latch.svg
    design: week3/mux4_latch.v
    testbench: week3/tbv_mux4_latch.v
    weeks: [3]
    categories: [core]

  - name: "Incomplete sensitivity list"
    description: "Deliberately wrong. sel is missing from the sensitivity list, so the simulation lags; a synthesiser builds the multiplexer anyway."
    image: week3/sens.svg
    design: week3/sens.v
    testbench: week3/tbv_sens.v
    weeks: [3]
    categories: [core]

  - name: "Priority encoder with if-else"
    description: "If-else statements nest into a priority chain, so r[3] wins over everything."
    image: week3/priority.svg
    design: week3/priority.v
    testbench: week3/tbv_priority.v
    weeks: [3]
    categories: [core]

  - name: "Priority encoder with casez"
    description: "The default branch is what stops a latch and what reports 'no request'. "
    image: week3/casez.svg
    design: week3/casez.v
    testbench: week3/tbv_casez.v
    weeks: [3]
    categories: [core]

  - name: "Width and signedness gotchas"
    description: "Width and signedness are decided by the operands, not the target: 3 − 5 in four bits is 14."
    image: week3/gotcha.svg
    design: week3/gotcha.v
    testbench: week3/tbv_gotcha.v
    weeks: [3]
    categories: [core]

  - name: "Expression widths"
    description: "The target width extends an addition, but not inside a concatenation."
    image: week3/width.svg
    design: week3/width.v
    testbench: week3/tbv_width.v
    weeks: [3]
    categories: [core]

  - name: "Full adder: gate primitives"
    description: "Gate primitives: the netlist written out directly."
    image: week3/fa_gate.svg
    design: week3/fa_gate.v
    testbench: week3/tbv_fa_gate.v
    weeks: [3]
    categories: [core]

  - name: "Full adder: dataflow"
    description: "The same full adder, described by what it does rather than how."
    image: week3/fa_data.svg
    design: week3/fa_data.v
    testbench: week3/tbv_fa_data.v
    weeks: [3]
    categories: [core]

  - name: "4-bit ripple-carry adder"
    description: "Four instances of one full-adder module, chained through the carries."
    image: week3/adder4.svg
    design: week3/adder4.v
    testbench: week3/tbv_adder4.v
    weeks: [3]
    categories: [core]

  - name: "4-bit adder: self-checking testbench"
    description: "All 512 input combinations compared against a + b + cin, with one line of verdict. The shape every bench in this course should take. "
    image: week3/adder4_check.svg
    design: week3/adder4.v
    testbench: week3/tb_adder4_check.v
    weeks: [3]
    categories: [core]

  - name: "Activity 1: sensitivity list, as set"
    description: "The activity module as set: b is absent from the sensitivity list, so y does not follow it. "
    image: week3/act1.svg
    design: week3/act1.v
    testbench: week3/tbv_act1.v
    weeks: [3]
    categories: [core]

  - name: "Activity 1: fixed with always @*"
    description: "always @* builds the sensitivity list from the block itself. "
    image: week3/act1_fixed.svg
    design: week3/act1_fixed.v
    testbench: week3/tbv_act1_fixed.v
    weeks: [3]
    categories: [core]

  - name: "D flip-flop with synchronous reset"
    description: "Reset is sampled on the clock edge like any other input."
    image: week3/dff_sync.svg
    design: week3/dff_sync.v
    testbench: week3/tbv_dff_sync.v
    weeks: [3]
    categories: [core]

  - name: "Shift register: non-blocking"
    description: "Three flip-flops: the pulse takes three clocks to reach q3."
    image: week3/shift_nb.svg
    design: week3/shift_nb.v
    testbench: week3/tbv_shift_nb.v
    weeks: [3]
    categories: [core]

  - name: "Shift register: blocking"
    description: "The same three lines with blocking assignment build one flip-flop: the pulse reaches q3 on the same clock."
    image: week3/shift_b.svg
    design: week3/shift_b.v
    testbench: week3/tbv_shift_b.v
    weeks: [3]
    categories: [core]

  - name: "5-bit counter with enable"
    description: "No else: q holds when en is low, which is what a register does."
    image: week3/counter.svg
    design: week3/counter.v
    testbench: week3/tbv_counter.v
    weeks: [3]
    categories: [core]

  - name: "Synchronous vs asynchronous reset"
    description: "A reset pulse shorter than a clock period is invisible to one of these flip-flops."
    image: week3/resets.svg
    design: week3/resets.v
    testbench: week3/tbv_resets.v
    weeks: [3]
    categories: [core]

  - name: "Sequence detector (week 1 machine)"
    description: "The machine derived in week 1, coded in the three-block style. "
    image: week3/seqdet.svg
    design: week3/seqdet.v
    testbench: week3/tbv_seqdet.v
    weeks: [3]
    categories: [core]

  - name: "Gray-code counter (week 2 machine)"
    description: "The machine from the week 2 activity, in the three-block form, with a Moore output."
    image: week3/gray.svg
    design: week3/gray.v
    testbench: week3/tbv_gray.v
    weeks: [3]
    categories: [core]

  - name: "Activity 2: counter testbench, as set"
    description: "The bench with its three sections missing. It compiles and runs against the counter and prints nothing, which is what there is to fix. "
    image: week3/counter.svg
    design: week3/counter.v
    testbench: week3/tb_counter_activity.v
    weeks: [3]
    categories: [core]

  - name: "Activity 2: counter testbench, worked"
    description: "The same bench, worked. It prints one line."
    image: week3/counter.svg
    design: week3/counter.v
    testbench: week3/tb_counter_answer.v
    weeks: [3]
    categories: [core]

  # ---- Week 3: live examples ----
  # - name: My live example
  #   description: One or two sentences shown on the tile.
  #   image: week3/live_example.svg
  #   design: week3/live_example.v
  #   testbench: week3/tb_live_example.v
  #   weeks: [3]
  #   categories: [live]

  - name: "always @(*) gotcha"
    description: "Expecting a change on something not inside the always block?"
    image: week3/always.svg
    design: week3/always.v
    testbench: week3/tbv_always.v
    weeks: [3]
    categories: [live]

  - name: "Static hazard"
    description: "z = a·b + a̅·c·d̅ should stay 1 while a changes, but the two terms have different delays, so z glitches to 0 for 12 ns when a falls. Look in the waveform: the printed table never sees it."
    image: week3/static_hazard.svg
    design: week3/static_hazard.v
    testbench: week3/tbv_static_hazard.v
    weeks: [3]
    categories: [live]

  - name: "Static hazard fixed: consensus term"
    description: "The same circuit with the consensus term b·c·d̅ added. It does not change the logic, but it stays 1 while a changes, so z no longer glitches when a falls."
    image: week3/static_hazard_fixed.svg
    design: week3/static_hazard_fixed.v
    testbench: week3/tbv_static_hazard_fixed.v
    weeks: [3]
    categories: [live]

  # ---- Week 3: problem set 3, problems (testbench only: students write the design) ----
  - name: "Problem 3.1: 1-bit 2-to-1 multiplexer"
    description: "Write the design, then run it against this testbench. Use this header: module ps3_mux2 (input a, b, sel, output y). The transcript ends PASS or FAIL."
    image: week3/ps3_1_mux2_problem.svg
    testbench: week3/tbv_ps3_1_mux2.v
    weeks: [3]
    categories: [problems]

  - name: "Problem 3.2: 4-bit 2-to-1 multiplexer"
    description: "Write the design, then run it against this testbench. Use this header: module ps3_mux2x4 (input [3:0] a, b, input sel, output [3:0] y). The transcript ends PASS or FAIL."
    image: week3/ps3_2_mux2x4_problem.svg
    testbench: week3/tbv_ps3_2_mux2x4.v
    weeks: [3]
    categories: [problems]

  - name: "Problem 3.3: 1-bit 4-to-1 multiplexer (case)"
    description: "Write the design, then run it against this testbench. Use this header: module ps3_mux4 (input [3:0] d, input [1:0] sel, output reg y). The transcript ends PASS or FAIL."
    image: week3/ps3_3_mux4_problem.svg
    testbench: week3/tbv_ps3_3_mux4.v
    weeks: [3]
    categories: [problems]

  - name: "Problem 3.4: 8-bit 4-to-1 multiplexer"
    description: "Write the design, then run it against this testbench. Use this header: module ps3_mux4x8 (input [7:0] d0, d1, d2, d3, input [1:0] sel, output reg [7:0] y). The transcript ends PASS or FAIL."
    image: week3/ps3_4_mux4x8_problem.svg
    testbench: week3/tbv_ps3_4_mux4x8.v
    weeks: [3]
    categories: [problems]

  - name: "Problem 3.5: 8-to-3 binary encoder"
    description: "Write the design, then run it against this testbench. Use this header: module ps3_enc8to3 (input [7:0] a, output reg [2:0] y). The transcript ends PASS or FAIL."
    image: week3/ps3_5_enc8to3_problem.svg
    testbench: week3/tbv_ps3_5_enc8to3.v
    weeks: [3]
    categories: [problems]

  - name: "Problem 3.6: 5-bit counter, synchronous reset"
    description: "Write the design, then run it against this testbench. Use this header: module ps3_count5 (input clk, rst, output reg [4:0] q). The transcript ends PASS or FAIL."
    image: week3/ps3_6_count5_problem.svg
    testbench: week3/tbv_ps3_6_count5.v
    weeks: [3]
    categories: [problems]

  - name: "Problem 3.7: 5-bit up/down counter"
    description: "Write the design, then run it against this testbench. Use this header: module ps3_updown5 (input clk, rst, up, output reg [4:0] q). The transcript ends PASS or FAIL."
    image: week3/ps3_7_updown5_problem.svg
    testbench: week3/tbv_ps3_7_updown5.v
    weeks: [3]
    categories: [problems]

  - name: "Problem 3.8(a): shift register: find the fault"
    description: "Paste the module from the problem sheet as the design and run it to reproduce the transcript. Then fix the one fault until the testbench reports PASS."
    image: week3/ps3_8a_shift3_problem.svg
    testbench: week3/tbv_ps3_8a_shift3.v
    weeks: [3]
    categories: [problems]

  - name: "Problem 3.8(b): 4-bit adder: find the fault"
    description: "Paste the module from the problem sheet as the design and run it to reproduce the transcript. Then fix the one fault until the testbench reports PASS."
    image: week3/ps3_8b_add4_problem.svg
    testbench: week3/tbv_ps3_8b_add4.v
    weeks: [3]
    categories: [problems]

  - name: "Problem 3.8(c): three-way selector: find the fault"
    description: "Paste the module from the problem sheet as the design and run it to reproduce the transcript. Then fix the one fault until the testbench reports PASS."
    image: week3/ps3_8c_sel3_problem.svg
    testbench: week3/tbv_ps3_8c_sel3.v
    weeks: [3]
    categories: [problems]

  # ---- Week 3: problem set 3, solutions (design and testbench) ----
  - name: "Solution 3.1: 1-bit 2-to-1 multiplexer"
    description: "One continuous assignment. Every signal is a wire: nothing is assigned in an always block."
    image: week3/ps3_1_mux2.svg
    design: week3/ps3_1_mux2.v
    testbench: week3/tbv_ps3_1_mux2.v
    weeks: [3]
    categories: [solutions]

  - name: "Solution 3.2: 4-bit 2-to-1 multiplexer"
    description: "3.1 with [3:0] added to a, b and y. The assign line and the one-bit sel are unchanged."
    image: week3/ps3_2_mux2x4.svg
    design: week3/ps3_2_mux2x4.v
    testbench: week3/tbv_ps3_2_mux2x4.v
    weeks: [3]
    categories: [solutions]

  - name: "Solution 3.3: 1-bit 4-to-1 multiplexer (case)"
    description: "A four-branch case. The default branch covers a selector containing x or z, which only exists in simulation."
    image: week3/ps3_3_mux4.svg
    design: week3/ps3_3_mux4.v
    testbench: week3/tbv_ps3_3_mux4.v
    weeks: [3]
    categories: [solutions]

  - name: "Solution 3.4: 8-bit 4-to-1 multiplexer"
    description: "3.3 with four 8-bit data inputs and an 8-bit output. The case statement keeps the same shape."
    image: week3/ps3_4_mux4x8.svg
    design: week3/ps3_4_mux4x8.v
    testbench: week3/tbv_ps3_4_mux4x8.v
    weeks: [3]
    categories: [solutions]

  - name: "Solution 3.5: 8-to-3 binary encoder"
    description: "The eight truth-table rows as a case. The default makes the other 248 inputs an explicit don't care; leaving it out would infer a latch."
    image: week3/ps3_5_enc8to3.svg
    design: week3/ps3_5_enc8to3.v
    testbench: week3/tbv_ps3_5_enc8to3.v
    weeks: [3]
    categories: [solutions]

  - name: "Solution 3.6: 5-bit counter, synchronous reset"
    description: "Counts 0 to 31, then wraps to 0. Nothing extra is written: the five-bit width of q drops the carry."
    image: week3/ps3_6_count5.svg
    design: week3/ps3_6_count5.v
    testbench: week3/tbv_ps3_6_count5.v
    weeks: [3]
    categories: [solutions]

  - name: "Solution 3.7: 5-bit up/down counter"
    description: "Counts up when up = 1 and down when up = 0, wrapping both ways, with a synchronous reset to zero."
    image: week3/ps3_7_updown5.svg
    design: week3/ps3_7_updown5.v
    testbench: week3/tbv_ps3_7_updown5.v
    weeks: [3]
    categories: [solutions]

  - name: "Solution 3.8(a): shift register, corrected"
    description: "The fault was blocking assignments in a clocked block, which moved d through all three bits in one clock. Non-blocking fixes it."
    image: week3/ps3_8a_shift3.svg
    design: week3/ps3_8a_shift3.v
    testbench: week3/tbv_ps3_8a_shift3.v
    weeks: [3]
    categories: [solutions]

  - name: "Solution 3.8(b): 4-bit adder, corrected"
    description: "The fault was a four-bit sum, which lost the carry before the comparison. {cout, sum} = a + b makes the result five bits wide."
    image: week3/ps3_8b_add4.svg
    design: week3/ps3_8b_add4.v
    testbench: week3/tbv_ps3_8b_add4.v
    weeks: [3]
    categories: [solutions]

  - name: "Solution 3.8(c): three-way selector, corrected"
    description: "The fault was a case with no branch for sel = 11, which inferred a latch. A default branch fixes it."
    image: week3/ps3_8c_sel3.svg
    design: week3/ps3_8c_sel3.v
    testbench: week3/tbv_ps3_8c_sel3.v
    weeks: [3]
    categories: [solutions]

  # ---- Earlier example (no week or category yet, so it shows under "Other") ----
  - name: 2-to-1 Multiplexer (dataflow)
    description: A 2-to-1 multiplexer described with a continuous assignment.
    image: mux_df.svg
    design: d_mux_df.v
    testbench: t_mux_df.v
